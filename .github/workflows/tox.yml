name: tox

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest (>=26.04) has no Python 3.8 builds, and tubular still runs on 3.8 in some places
        # https://2u-internal.atlassian.net/browse/LP-1558 tracks the work to unpin this
        os: [ubuntu-24.04]
        python-version: ['3.8', '3.12']
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64
    - run: rm -f /etc/boto.cfg
    - run: pip3 install --upgrade pip setuptools
    - run: pip3 install 'tox'
    - run: tox -e "py$(echo '${{ matrix.python-version }}' | tr -d .)" -- -n0

    - name: Run coverage
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        flags: unittests
        fail_ci_if_error: false
